<body>

  <!-- Shared Header Shell -->

    <nav>
    <div class="wrap">
        <div class="brand"><span class="logo"><img src="img/agroselect-logo-mark.svg" alt="logo"></span>AgroSelect</div>

  <!-- Contact Page Content -->
  <main>
    <h2>Contact Us</h2>
    <div class="form-field">
        <form>
        <label for="name">Name:</label>
        <input type="text" id="name" required>

        <label for="message">Message:</label>
        <textarea id="message" rows="4" required></textarea>

        <button type="submit">Submit</button>
        </form>
    </div>
  </main>

  <!-- Shared Footer Shell -->
  <footer>
    <p>Contact: <a href="mailto:support@agroselect.org">support@agroselect.org</a> | +234 800 000 1234</p>

  </footer>
